# Config for build_cards.py -- one entry per podcast this tool knows how
# to build into Yoto MYO cards. Add a new entry to support a new show;
# nothing in build_cards.py itself should need to change. Pick which
# podcast+season to build with `--podcast <name> --season <N>`.
#
# Fields:
#   title              Display name of the podcast. Card titles are
#                       derived as "<title> — S<season> Card N (...)".
#   feed_url           The podcast's original RSS feed URL. Still
#                       required as a fallback/reference even when
#                       local_feed_paths is set (see below).
#   icon_palette       Name of one palette (see icon_gen.py's PALETTES
#                       dict: original, cmyk, cmyk_bright, warm, cool,
#                       pastel, neon, rainbow) used for this podcast's
#                       cards. The season number indexes into that
#                       palette's color list (season 1 -> colors[0],
#                       season 2 -> colors[1], ...), so different seasons
#                       of the same podcast are still visually distinct
#                       from each other, while different podcasts read
#                       as distinct via their own palette. Defaults to
#                       "original" if omitted.
#   strip_ads          Optional, default unset (no ad removal). One of:
#                         megaphone-header -- for shows served through
#                                     Megaphone (check: does a HEAD/GET on
#                                     an episode's audio URL return an
#                                     x-megaphone-payload-2 header?). That
#                                     header gives an exact byte-offset
#                                     map of every ad segment on every
#                                     single download -- byte-precise, one
#                                     download per episode, no diffing.
#                                     Prefer this whenever the header is
#                                     present; the two modes below are
#                                     probabilistic fallbacks for shows
#                                     that don't send it.
#                         dynamic  -- for shows with server-side dynamic
#                                     ad insertion (a fresh, different ad
#                                     stitched into every download).
#                                     Downloads each episode TWICE and
#                                     diffs the copies to find and cut
#                                     whatever's unique to one. Roughly
#                                     doubles download time per episode,
#                                     and misses an ad if both downloads
#                                     happen to get the same one.
#                         leading  -- for shows with a static ad (same
#                                     content every download) in front of
#                                     a consistent intro jingle. Derives
#                                     the jingle once from two reference
#                                     episodes, then for every episode
#                                     finds where it starts and cuts
#                                     everything before it. One download
#                                     per episode; only catches ads before
#                                     the jingle.
#                       See ad_strip.py's module docstring for how each
#                       one works and its real limitations.
#   title_patterns      Optional. Maps season number -> a regex (one
#                       capture group = episode number) matched against
#                       episode titles, used INSTEAD of the feed's
#                       itunes:season/itunes:episode tags for that season.
#                       For shows whose season/episode tags are
#                       inconsistent, missing, or mix in unrelated
#                       content under the same season number (see
#                       tales-of-bob below), this is the only reliable
#                       way to build a clean episode sequence. Still
#                       needed even when local_feed_paths is set, since
#                       our generated feeds preserve each item's
#                       original itunes:season/episode tags unchanged --
#                       filtering already happened at feed-build time,
#                       but per-item episode *numbering* still comes
#                       from wherever it reliably lives (title or tags).
#   local_feed_paths    Optional. Maps season number -> a list of repo-
#                       relative paths to this podcast's OWN generated
#                       podcasts/<slug>/feeds/*.xml parts (see
#                       .claude/skills/add-rss-feed). When set, these are
#                       fetched and merged INSTEAD of feed_url -- they're
#                       already filtered to just the right episodes (no
#                       bonus/interlude/side-content) and reordered, so
#                       there's no need to re-derive that here, and no
#                       dependency on the original host feed staying up
#                       or unchanged. List every part for the season/
#                       campaign; order doesn't matter, episodes get
#                       re-sorted by number regardless.

titans:
  title: "The Titans of All'Terra"
  feed_url: "https://titansofallterra.libsyn.com/rss"
  icon_palette: original
  local_feed_paths:
    1:
      - "podcasts/titans-of-allterra/feeds/season1-part1.xml"
      - "podcasts/titans-of-allterra/feeds/season1-part2.xml"
    2:
      - "podcasts/titans-of-allterra/feeds/season2-part1.xml"
      - "podcasts/titans-of-allterra/feeds/season2-part2.xml"
    3:
      - "podcasts/titans-of-allterra/feeds/season3-part1.xml"

tales-of-bob:
  title: "Tales of Bob"
  feed_url: "https://feeds.simplecast.com/_6JPR3jO"
  icon_palette: warm
  # Routed through Megaphone -- confirmed it sends the
  # x-megaphone-payload-2 ad-break header (see ad_strip.py) even though
  # this show's audio is otherwise STATIC per URL (two downloads of the
  # same episode came back byte-identical, which is why strip_ads:
  # dynamic's diffing wouldn't have worked here -- megaphone-header
  # doesn't care, it reads the header instead of diffing).
  strip_ads: megaphone-header
  # "Season 1" here means the whole Broken Tusk Rising campaign (93
  # chapters, zero-indexed -- Chapter 000 is the first) -- there's no
  # real season structure in this show, and the feed's actual season
  # tags are unreliable/inconsistent (see podcasts/tales-of-bob/README.md
  # for the full breakdown), so episodes are selected by title pattern
  # instead.
  title_patterns:
    1: 'Broken Tusk Rising Chapter (\d+) \[Pathfinder 2E\]'
  local_feed_paths:
    1:
      - "podcasts/tales-of-bob/feeds/broken-tusk-rising-part1.xml"
      - "podcasts/tales-of-bob/feeds/broken-tusk-rising-part2.xml"
      - "podcasts/tales-of-bob/feeds/broken-tusk-rising-part3.xml"
      - "podcasts/tales-of-bob/feeds/broken-tusk-rising-part4.xml"

sneak-attack:
  title: "Sneak Attack!"
  feed_url: "https://sneakattack.libsyn.com/rss"
  icon_palette: neon
  local_feed_paths:
    1:
      - "podcasts/sneak-attack/feeds/season1-part1.xml"
      - "podcasts/sneak-attack/feeds/season1-part2.xml"
      - "podcasts/sneak-attack/feeds/season1-part3.xml"
      - "podcasts/sneak-attack/feeds/season1-part4.xml"
      - "podcasts/sneak-attack/feeds/season1-part5.xml"
      - "podcasts/sneak-attack/feeds/season1-part6.xml"
      - "podcasts/sneak-attack/feeds/season1-part7.xml"

dungeons-dragons-daughters:
  title: "Dungeons & Dragons & Daughters"
  feed_url: "https://feed.podbean.com/dungeonsdragonsdaughters/feed.xml"
  icon_palette: pastel
  # "Season 1" here means Campaign 1 (chapters 0-69, complete) -- almost
  # none of this feed's items carry a usable itunes:season tag (see
  # podcasts/dungeons-dragons-daughters/README.md), so episodes are
  # selected by the leading chapter number in each title instead.
  title_patterns:
    1: '^(\d+)\.\s+DDD\s+.+$'
  local_feed_paths:
    1:
      - "podcasts/dungeons-dragons-daughters/feeds/campaign1-part1.xml"
      - "podcasts/dungeons-dragons-daughters/feeds/campaign1-part2.xml"
      - "podcasts/dungeons-dragons-daughters/feeds/campaign1-part3.xml"

stinky-dragon:
  title: "Tales from the Stinky Dragon"
  feed_url: "https://feeds.megaphone.fm/stinkydragon"
  icon_palette: rainbow
  # Started out as strip_ads: dynamic (Megaphone stitches a different ad
  # into each request -- confirmed via two different-duration downloads
  # of the same episode), but that missed real ads whenever both
  # downloads happened to land the same ad (confirmed: a byte-identical
  # pair on a later episode, with a real ~5 minute mid+pre+post ad load
  # sitting in the audio undetected). Switched to megaphone-header, which
  # reads the exact ad-break byte offsets Megaphone sends in the
  # x-megaphone-payload-2 response header on every download instead of
  # inferring them -- see ad_strip.py's module docstring.
  strip_ads: megaphone-header
  # "Season 1"/"Season 2" here mean Campaign 1 and Campaign 2 (86 + 50
  # episodes, both complete) -- this feed's season tags mislabel a
  # post-finale bonus mini-arc as part of Campaign 1's numbering and
  # don't reliably cover Campaign 3 at all (see
  # podcasts/stinky-dragon/README.md), so episodes are selected by each
  # campaign's "C0N - Ep. NN - " title pattern instead.
  title_patterns:
    1: '^C01 - Ep\.\s*(\d+)\s*-'
    2: '^C02 - Ep\.\s*(\d+)\s*-'
  local_feed_paths:
    1:
      - "podcasts/stinky-dragon/feeds/campaign1-part1.xml"
      - "podcasts/stinky-dragon/feeds/campaign1-part2.xml"
      - "podcasts/stinky-dragon/feeds/campaign1-part3.xml"
      - "podcasts/stinky-dragon/feeds/campaign1-part4.xml"
    2:
      - "podcasts/stinky-dragon/feeds/campaign2-part1.xml"
      - "podcasts/stinky-dragon/feeds/campaign2-part2.xml"
